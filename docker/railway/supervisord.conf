; Process manager for the single-container Railway deployment.
; Started by docker/railway/entrypoint.sh once the site is ready.

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Only used when no Redis service is attached (see entrypoint resolve_redis).
[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory-policy noeviction
priority=5
autostart=%(ENV_EMBEDDED_REDIS)s
autorestart=true
startsecs=3
user=frappe
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/home/frappe/frappe-bench/env/bin/gunicorn --bind 127.0.0.1:8000 --workers %(ENV_GUNICORN_WORKERS)s --threads %(ENV_GUNICORN_THREADS)s --worker-class gthread --timeout %(ENV_GUNICORN_TIMEOUT)s --preload frappe.app:application
directory=/home/frappe/frappe-bench/sites
user=frappe
environment=HOME="/home/frappe",PATH="/home/frappe/frappe-bench/env/bin:/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
command=/usr/local/bin/node apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",PATH="/usr/local/bin:/usr/bin:/bin"
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/bench worker --queue %(ENV_WORKER_QUEUES)s
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",PATH="/home/frappe/frappe-bench/env/bin:/usr/local/bin:/usr/bin:/bin"
priority=30
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=360
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/bench schedule
directory=/home/frappe/frappe-bench
user=frappe
environment=HOME="/home/frappe",PATH="/home/frappe/frappe-bench/env/bin:/usr/local/bin:/usr/bin:/bin"
priority=30
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
